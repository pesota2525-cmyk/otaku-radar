name: Update OTAKU RADAR

on:
  workflow_dispatch:
  schedule:
    - cron: "15 10 * * *"   # 19:15 JST every day
    - cron: "15 22 * * *"   # 07:15 JST every day

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: otaku-radar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python scripts/fetch_feeds.py

      - name: Commit refreshed data
        run: |
          git config user.name "otaku-radar-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/items.json

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update radar data"
            git pull --rebase origin main
            git push origin main
          fi

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
