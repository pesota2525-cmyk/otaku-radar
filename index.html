<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0d12">
  <title>OTAKU RADAR</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div>
    <div class="eyebrow">DAILY DISCOVERY FEED</div>
    <h1>OTAKU RADAR</h1>
    <p>グッズ・イベント・撮影会・注目商品を、画像中心で流し見。</p>
  </div>
  <div class="meta">
    <span id="updated">更新待ち</span>
    <button id="savedOnly" class="ghost">★ 保存だけ</button>
  </div>
</header>

<nav id="filters" class="filters">
  <button class="active" data-cat="all">全部</button>
  <button data-cat="goods">グッズ</button>
  <button data-cat="figure">フィギュア</button>
  <button data-cat="lottery">くじ・プライズ</button>
  <button data-cat="collab">コラボ</button>
  <button data-cat="cosplay">コスプレ</button>
  <button data-cat="photo">撮影会</button>
  <button data-cat="eroge">PCゲーム特典</button>
  <button data-cat="bookbonus">漫画特典</button>
  <button data-cat="doujin">同人誌</button>
  <button data-cat="gamers">ゲーマーズ</button>
  <button data-cat="trend">🔥 注目商品</button>
</nav>

<main>
  <div class="toolbar">
    <input id="search" placeholder="作品名・商品名・イベント名で検索">
    <select id="sort">
      <option value="hot">注目順</option>
      <option value="new">新着順</option>
    </select>
  </div>
  <div id="empty" class="empty" hidden>
    <h2>まだデータがない！</h2>
    <p>GitHub Actionsが1回動くと、ここに新着カードが並ぶよ。</p>
  </div>
  <section id="grid" class="grid"></section>
</main>

<template id="cardTemplate">
  <article class="card">
    <a class="imageWrap" target="_blank" rel="noopener noreferrer">
      <img loading="lazy" alt="">
      <div class="fallback">NO IMAGE</div>
      <span class="badge"></span>
    </a>
    <div class="body">
      <div class="source"></div>
      <a class="title" target="_blank" rel="noopener noreferrer"></a>
      <div class="bottom">
        <time></time>
        <button class="save" aria-label="保存">☆</button>
      </div>
    </div>
  </article>
</template>

<script src="app.js"></script>
</body>
</html>
